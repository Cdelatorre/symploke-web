<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terapia · Symploké</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&amp;family=DM+Serif+Display&amp;display=swap">
<link rel="stylesheet" href="comun.css">
<style>
:root{
  color-scheme:light dark;
  --bg:#FFFFFF; --ink:#10241C; --ink2:#33433C; --brand:#009966; --brandink:#007A50;
  --line:#DCEBE4; --soft:#EEF8F3; --btntext:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1712; --ink:#EAF4EF; --ink2:#B6CCC2; --brand:#34C990; --brandink:#7FE0B9;
    --line:#1D372C; --soft:#10251C; --btntext:#052018;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1712; --ink:#EAF4EF; --ink2:#B6CCC2; --brand:#34C990; --brandink:#7FE0B9;
  --line:#1D372C; --soft:#10251C; --btntext:#052018;
}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'DM Serif Display',Georgia,serif;font-weight:400;margin:0;color:var(--ink)}
.nav{position:sticky;top:0;z-index:20;height:96px;display:flex;align-items:center;gap:14px;padding:0 clamp(20px,4.5vw,64px) 0 clamp(14px,1.8vw,26px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:14px;font-family:'DM Serif Display',Georgia,serif;font-size:38px;line-height:1;color:var(--brandink);text-decoration:none}
.links{margin-left:auto;display:flex;gap:28px;font-size:15px;font-weight:500;color:var(--ink2)}
.links a{color:inherit;text-decoration:none}
.links a.on{color:var(--brandink);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:600 17px/1 'DM Sans',sans-serif;padding:18px 30px;border-radius:999px;border:2px solid var(--brand);text-decoration:none;cursor:pointer;transition:transform .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--brand);color:var(--btntext)}
.btn.ghost{background:transparent;color:var(--brandink);padding:16px 28px}
.btn.small{font-size:15px;padding:12px 22px}
main{max-width:1240px;margin:0 auto;padding:8px clamp(20px,4.5vw,64px) clamp(64px,8vw,100px)}
.lead{font-size:clamp(16px,1.3vw,19px);line-height:1.42;color:var(--ink2);margin:0;max-width:640px}
h2{font-size:clamp(28px,3vw,42px);line-height:1.05;margin:0 0 12px}
.verify,.draft{font:600 11px/1 'DM Sans',sans-serif;letter-spacing:.3px;color:var(--brandink);border:1px dashed var(--brand);border-radius:6px;padding:3px 6px;vertical-align:middle;white-space:nowrap}
.verify{color:#8A5A00;border-color:#D9A640;background:#FFF6E0}
.gap{color:var(--ink2);opacity:.7}

/* cabecera: texto a la izquierda y la ilustración suelta, que se dibuja al entrar */
.crumbs{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin:16px 0 18px}
.crumbs a{color:inherit;text-decoration:none}
.crumbs a:hover{color:var(--brandink)}
.mhero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:center}
.mhero h1{font-size:clamp(44px,5vw,72px);line-height:.98;letter-spacing:-.5px;margin:0 0 16px}
.mhero .help{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(22px,2vw,28px);line-height:1.2;color:var(--brandink);margin:20px 0 0}
.cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:26px}
.art svg{display:block;width:100%;height:auto}
.art svg > rect[width="400"]{fill:transparent}

/* lo que se siente */
.feel{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,4vw,64px);margin-top:clamp(64px,8vw,104px);padding:clamp(28px,4vw,52px);background:var(--soft);border:1px solid var(--line);border-radius:28px}
.feel .note{font-size:13px;color:var(--ink2);line-height:1.45;margin:10px 0 0}
.feel ul{list-style:none;margin:0;padding:0}
.feel li{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(22px,2vw,28px);line-height:1.2;color:var(--ink);padding:12px 0;border-bottom:1px solid var(--line)}
.feel li:first-child{padding-top:0}
.feel .reco{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:22px}
.feel .reco p{margin:0;font-weight:600}
.alert{border-left:3px solid var(--brand);padding:6px 0 6px 14px;font-size:15px;line-height:1.42;color:var(--ink2);margin:18px 0 0}

/* texto: ciencia y más allá de la etiqueta */
.read{max-width:780px;margin-top:clamp(64px,8vw,104px)}
.read section+section{margin-top:56px}
.layer,.read p.layer{font:600 12px/1 'DM Sans',sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--brandink);margin:0 0 12px}
.read p{font-size:18px;line-height:1.6;color:var(--ink2);margin:0 0 16px}
.read .refs{font-size:15px;border-left:3px solid var(--line);padding-left:16px}
.read .beyond{border-left:3px solid var(--brand);padding-left:20px}

/* enfoques */
.psy{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:22px}
.psy article{background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:22px}
.psy h3{font-size:21px;line-height:1.1;margin-bottom:8px}
.psy p{margin:0 0 10px;font-size:15px;line-height:1.42;color:var(--ink2)}
.psy .ev{font-size:13px;margin:0}
.care{border:1px solid var(--line);border-radius:22px;padding:22px 26px;margin-top:22px;font-size:16px;line-height:1.5;color:var(--ink2)}
.care h3{font-size:21px;margin-bottom:8px;color:var(--ink)}
.care p{margin:0 0 6px}
.subs{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 0;padding:0;list-style:none}
.subs li{font-size:15px;padding:9px 16px;border:1px solid var(--line);border-radius:999px;color:var(--ink2)}

/* «Podemos ayudarte», igual que en la página de terapia */
.band{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);margin-top:clamp(64px,8vw,104px);background:var(--soft);border:1px solid var(--line);border-radius:28px;overflow:hidden;transition:border-color .15s ease,transform .2s ease,box-shadow .2s ease}
.band:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 0 0 1.5px var(--brand),0 14px 34px rgba(0,60,40,.12)}
.band .pic{background:#fff;min-height:260px;position:relative}
.band .pic svg{position:absolute;inset:0;width:100%;height:100%}
.band .t{padding:clamp(28px,4vw,52px);display:flex;flex-direction:column;justify-content:center;gap:14px}
.band h2{margin:0}
.band p{margin:0;color:var(--ink2);line-height:1.42}
.band .btn{align-self:flex-start}
.band .urg{font-size:14px}

.pn{display:flex;justify-content:space-between;gap:16px;margin-top:40px;padding-top:22px;border-top:1px solid var(--line);font-size:14px}
.pn a{text-decoration:none;color:var(--ink2)}
.pn a:hover{color:var(--brandink)}
.pn b{display:block;margin-top:4px;font:400 22px/1.1 'DM Serif Display',Georgia,serif;color:var(--ink)}
footer{padding:28px clamp(20px,4.5vw,64px) 40px;font-size:14px}
@media (max-width:860px){
  .links{display:none}
  .brand{font-size:26px;gap:8px}
  .brand svg{width:48px;height:48px}
  .nav{height:76px}
  .nav .btn.small{margin-left:auto;white-space:nowrap;padding:10px 14px;font-size:14px}
  .mhero,.feel,.band{grid-template-columns:1fr}
  .mhero .art{order:-1}
  .psy{grid-template-columns:1fr}
}
</style>
</head>
<body>

<script>
/* detalle de una terapia (motivo de consulta): motivo.html?m=slug; los textos salen de maqueta/motivos-data.js */
(function(){
'use strict';
var q=/[?&]m=([a-z]+)/.exec(location.search), m=motivoBySlug(q?q[1]:'ansiedad')||MOTIVOS[0], idx=MOTIVOS.indexOf(m);
var prev=MOTIVOS[(idx+MOTIVOS.length-1)%MOTIVOS.length], next=MOTIVOS[(idx+1)%MOTIVOS.length];
var D=' <span class="draft">borrador</span>', CITA='contacto.html', ARR=' <span class="arr" aria-hidden="true">→</span>';
var WA='<a class="btn ghost" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Consultar por WhatsApp</a>';
document.title=m.name+' · Psicólogo en Madrid centro y online · Symploké';
var h='';

h+='<section class="mhero"><div>';
h+='<nav class="crumbs" aria-label="Migas de pan"><a href="test1.html">Inicio</a><span aria-hidden="true">›</span><a href="terapia.html">Terapia</a><span aria-hidden="true">›</span><span>'+m.name+'</span></nav>';
h+='<h1>'+m.name+'</h1>';
h+='<p class="lead">'+m.intro+D+'</p>';
h+='<p class="help">'+m.cta+'</p>';
h+='<div class="cta"><a class="btn primary" href="'+CITA+'">Pedir cita'+ARR+'</a>'+WA+'</div>';
h+='</div><div class="art">'+ILUS[m.slug]('h'+m.slug)+'</div></section>';

h+='<section class="feel" aria-labelledby="suene"><div>';
h+='<p class="layer">Lo que se siente</p><h2 id="suene">Quizá te suene</h2>';
h+='<p class="note">Frases tal como las escribe la gente en Google. <span class="verify">[VERIFICAR con Google Trends]</span></p>';
h+='</div><div><ul>'+m.feel.map(function(f){return '<li>«'+f+'»</li>';}).join('')+'</ul>';
h+='<div class="reco"><p>¿Te reconoces? Es frecuente sentirse así.</p><a class="btn primary small" href="'+CITA+'">Pedir cita'+ARR+'</a></div>';
if(m.alert)h+='<p class="alert">'+m.alert+'</p>';
h+='</div></section>';

h+='<div class="read">';
h+='<section><p class="layer">Qué dice la ciencia</p><h2>Qué sabemos</h2><p>'+m.science+'</p><p class="refs">'+m.refs+'</p></section>';
h+='<section><p class="layer">Más allá de la etiqueta</p><h2>No eres un diagnóstico</h2><p class="beyond">'+m.beyond+'</p></section>';
h+='</div>';

h+='<section class="read" style="max-width:none"><p class="layer">Cómo trabajamos</p><h2>Hay varias psicologías</h2>';
h+='<p class="lead">No hay una sola psicología, y no todas tienen la misma evidencia para cada problema.</p>';
h+='<div class="psy">'+m.approaches.map(function(a){return '<article class="card"><h3>'+a[0]+'</h3><p>'+a[1]+'</p><p class="ev"><b>Evidencia:</b> '+a[2]+'. <span class="verify">[VERIFICAR]</span></p></article>';}).join('')+'</div>';
if(m.delicate||m.coord||m.consent){
  h+='<div class="care"><h3>'+(m.consent?'Menores y familia':'Con cuidado')+'</h3>';
  if(m.delicate)h+='<p>Formación en este ámbito: <span class="gap">[ ]</span></p>';
  if(m.coord)h+='<p>'+m.coord+'</p>';
  if(m.consent)h+='<p>'+m.consent+'</p>';
  h+='<p>No prometemos resultados: cada proceso es distinto.</p></div>';
}
if(m.subs)h+='<ul class="subs">'+m.subs.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul>';
h+='</section>';

h+='<section class="band"><div class="pic">'+ILUS.portada('band')+'</div><div class="t">';
h+='<h2>Podemos ayudarte</h2>';
h+='<p>Trabajamos para aliviar el sufrimiento, paso a paso. Empezamos con una valoración inicial: nos cuentas qué te pasa, lo pensamos juntos y buscamos cómo resolverlo.</p>';
h+='<a class="btn primary" href="'+CITA+'">Pide cita y lo vemos juntos'+ARR+'</a>';
h+='<p class="urg">Si estás en una urgencia, llama al <strong>112</strong>. Si tienes pensamientos de suicidio, llama al <strong>024</strong>.</p>';
h+='</div></section>';

h+='<nav class="pn" aria-label="Otras terapias"><a href="motivo.html?m='+prev.slug+'">← Anterior<b>'+prev.name+'</b></a><a href="motivo.html?m='+next.slug+'" style="text-align:right">Siguiente →<b>'+next.name+'</b></a></nav>';
document.getElementById('main').innerHTML=h;
drawIn(document.querySelector('.mhero .art svg'));
})();
</script>
