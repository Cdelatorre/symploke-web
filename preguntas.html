<script>
(function(){
'use strict';
var lista=MOTIVOS.filter(function(m){return m.corta&&m.faq;});   // de momento, solo las terapias resumidas (ansiedad y pareja)
/* 2026-11-10: desde cada terapia se llega con ?m=slug y solo salen sus preguntas; sin ?m, salen todas con índice */
var q=(location.search.match(/[?&]m=([a-z-]+)/)||[])[1]||location.hash.slice(1);
var sola=lista.filter(function(m){return m.slug===q;})[0];
if(sola){
  lista=[sola];
  var nom=(/^[A-ZÁÉÍÓÚ][a-záéíóúñ]/.test(sola.name)?sola.name.charAt(0).toLowerCase()+sola.name.slice(1):sola.name);
  document.title='Preguntas frecuentes sobre '+nom+' · Madrid y online';
  var md=document.querySelector('meta[name="description"]'); if(md)md.content='Dudas habituales sobre '+nom+': sesiones, terapia online y cómo trabajamos. Centro sanitario en Madrid y online.';
}
var h='<nav class="crumbs" aria-label="Migas de pan"><a href="test1.html">Inicio</a><span aria-hidden="true">›</span>'+(sola?'<a href="'+motivoUrl(sola)+'">'+sola.name+'</a><span aria-hidden="true">›</span>':'')+'<span>Preguntas frecuentes</span></nav>';
h+='<h1 class="wide">Preguntas frecuentes'+(sola?' sobre '+nom:'')+'</h1>';
h+='<div class="read preguntas">';
h+='<p>Las dudas que más nos plantean antes de empezar. Si la tuya no está, <a href="contacto.html">escríbenos o llámanos</a>.</p>';
if(lista.length>1)h+='<p class="indice">'+lista.map(function(m){return '<a href="#'+m.slug+'">'+m.name+'</a>';}).join(' · ')+'</p>';
var ld=[];
lista.forEach(function(m){
  h+='<section class="faq desplegable" id="'+m.slug+'">'+(sola?'':'<h2>'+m.name+'</h2>');   // con una sola terapia, el título ya va en el h1
  m.faq.forEach(function(f){
    h+='<details'+(f[2]?' id="'+f[2]+'"':'')+'><summary><h3>'+f[0]+'</h3></summary><p>'+f[1]+'</p></details>';
    ld.push({'@type':'Question',name:f[0],acceptedAnswer:{'@type':'Answer',text:f[1].replace(/<[^>]+>/g,'')}});
  });
  h+='<p class="volver"><a href="'+motivoUrl(m)+'"><span class="arr izq" aria-hidden="true">←</span> Volver a '+(/^[A-ZÁÉÍÓÚ][a-záéíóúñ]/.test(m.name)?m.name.charAt(0).toLowerCase()+m.name.slice(1):m.name)+'</a></p></section>';
});
h+='<p class="urg">Si estás en una urgencia, llama al <strong>112</strong>. Si tienes pensamientos de suicidio, llama al <strong>024</strong>.</p>';
h+='</div>';
document.getElementById('main').innerHTML=h;
var s=document.createElement('script');s.type='application/ld+json';   // datos estructurados de preguntas (FAQPage)
s.textContent=JSON.stringify({'@context':'https://schema.org','@type':'FAQPage',mainEntity:ld});
document.head.appendChild(s);
if(location.hash&&!(sola&&location.hash.slice(1)===sola.slug))setTimeout(function(){var e=document.getElementById(location.hash.slice(1));if(e)e.scrollIntoView({block:'start'});},200);
})();
</script>
