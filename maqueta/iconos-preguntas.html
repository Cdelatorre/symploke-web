<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Iconos de preguntas · Symploké</title>
<!-- Prueba (2026-11-10, 2.ª tanda): solo el signo de interrogación en verde clarito, de más redondeado a menos -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&amp;family=DM+Serif+Display&amp;family=Fredoka:wght@600&amp;family=Nunito:wght@800&amp;family=Quicksand:wght@700&amp;family=Varela+Round&amp;family=Poppins:wght@600&amp;family=Montserrat:wght@700&amp;family=Lora:wght@700&amp;family=Oswald:wght@600&amp;display=swap">
<style>
:root{--bg:#FFFFFF;--ink:#10241C;--ink2:#33433C;--line:#DCEBE4;--q:#5FE3A8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1180px;margin:0 auto;padding:clamp(28px,5vw,64px) 16px 80px}
h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(34px,4.5vw,54px);line-height:1.05;margin:0 0 12px}
.lead{font-size:18px;line-height:1.55;color:var(--ink2);margin:0 0 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.op{border:1px solid var(--line);border-radius:24px;padding:16px 16px 24px;text-align:center}
.op .n{display:block;text-align:left;font:600 15px/1 'DM Sans',sans-serif;color:var(--ink2)}
.op .q{display:block;font-size:140px;line-height:1.15;color:var(--q)}
</style>
</head>
<body>
<main>
  <h1>Signos de interrogación</h1>
  <p class="lead">Diez opciones en verde clarito, de la más redondeada (1) a la menos redondeada (10).</p>
  <div class="grid">
    <div class="op"><span class="n">1</span><span class="q" style="font-family:'Fredoka';font-weight:600">?</span></div>
    <div class="op"><span class="n">2</span><span class="q" style="font-family:'Nunito';font-weight:800">?</span></div>
    <div class="op"><span class="n">3</span><span class="q" style="font-family:'Varela Round'">?</span></div>
    <div class="op"><span class="n">4</span><span class="q" style="font-family:'Quicksand';font-weight:700">?</span></div>
    <div class="op"><span class="n">5</span><span class="q" style="font-family:'Poppins';font-weight:600">?</span></div>
    <div class="op"><span class="n">6</span><span class="q" style="font-family:'DM Sans';font-weight:700">?</span></div>
    <div class="op"><span class="n">7</span><span class="q" style="font-family:'Montserrat';font-weight:700">?</span></div>
    <div class="op"><span class="n">8</span><span class="q" style="font-family:'DM Serif Display'">?</span></div>
    <div class="op"><span class="n">9</span><span class="q" style="font-family:'Lora';font-weight:700">?</span></div>
    <div class="op"><span class="n">10</span><span class="q" style="font-family:'Oswald';font-weight:600">?</span></div>
  </div>
</main>
</body>
</html>
